[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "deepseek-harness-sdk"
version = "0.0.0.dev0"
description = "Python SDK for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]
# vendor 说明：本目录复制自 deepseek-harness 仓库 python/sdk（SDK 不在 PyPI，
# 生产镜像构建时 pip install ./vendor/deepseek-harness-sdk）。
# 与上游的差异：去掉 deepseek-harness-runtime-bin 依赖（单文件 dsh runtime 不
# 进镜像，改用镜像内 npm 安装的 @deepseek-ai/dsh，由 DSH_BIN 指定路径），
# 同时删除仅 uv 开发安装需要的 [tool.uv.sources]。
dependencies = [
  "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/deepseek-ai/deepseek-harness"
Documentation = "https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/deepseek-ai/deepseek-harness/issues"
Source = "https://github.com/deepseek-ai/deepseek-harness"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_harness"]

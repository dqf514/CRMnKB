services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crmnkb-postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm123
      POSTGRES_DB: crmnkb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crmnkb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

server {
    listen 80;
    server_name _;

    # 与后端 MAX_UPLOAD_MB 对齐
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头。注意：location 内一旦出现自己的 add_header（如下方 /assets/ 的
    # Cache-Control），server 级的 add_header 在该 location 内全部失效，需就地重复。
    # CSP 暂不加：SPA + Element Plus/ECharts 内联样式与动态脚本较多，
    # 稳妥的 CSP 需逐页验证（script-src/style-src 白名单），待定，勿硬上。
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 流式对话：关闭缓冲，长响应放宽超时
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 品牌静态资源（自定义 logo，由后端 StaticFiles 提供）
    location /brand/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host $host;
    }

    # 用户头像（由后端 StaticFiles 提供）
    location /avatars/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host $host;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（本 location 有自己的 add_header，server 级安全头在此失效，需重复）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# 最小 CI：后端 pytest + dsh PG 持久化插件契约测试 + 前端构建
# 后端测试不连真实数据库（fake session + monkeypatch，见 backend/tests/），无需 service 容器
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-pytest:
    name: 后端 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # requirements-dev.txt 首行 -r requirements.txt，一条命令装齐运行时 + 测试依赖
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  dsh-plugin-test:
    name: dsh PG 持久化插件契约测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh/session-persistence-pg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh/session-persistence-pg/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # lint 目前 0 error（仅少量历史 warn），eslint 默认 warn 不失败，可直接卡 error 级
      - run: npm run lint
      - run: npm test
      - run: npm run build

# 榜样知识库 nginx 站点配置（部署在独立的 nginx 发布服务器上）
# 把 <APP_SERVER_IP> 替换为应用服务器 IP；前端 dist 也放在这台 nginx 服务器上
# HTTPS：sudo certbot --nginx -d 你的域名
upstream crmnkb_backend {
    server <APP_SERVER_IP>:8100;   # ← 应用服务器地址
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # 有域名时换成域名，如 crm.example.com

    # 与后端 MAX_UPLOAD_MB 对齐
    client_max_body_size 100m;

    root /opt/crmnkb/frontend/dist;  # 前端构建产物在本服务器的存放路径
    index index.html;

    # API 反向代理到应用服务器
    location /api/ {
        proxy_pass http://crmnkb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式对话：关闭缓冲，长响应放宽超时
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 品牌静态资源（自定义 logo）
    location /brand/ {
        proxy_pass http://crmnkb_backend;
        proxy_set_header Host $host;
    }

    # 用户头像
    location /avatars/ {
        proxy_pass http://crmnkb_backend;
        proxy_set_header Host $host;
    }

    # 前端静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
